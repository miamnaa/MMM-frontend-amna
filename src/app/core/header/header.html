<header class="topbar">
  <div class="search">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input
      class="search-input"
      type="search"
      placeholder="Search projects, datasets, experiments"
      aria-label="Search"
    />
  </div>

  <div class="right">
    <button
      class="icon-btn"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.title]="theme() === 'dark' ? 'Light theme' : 'Dark theme'"
    >
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      }
    </button>

    <button
      class="icon-btn"
      type="button"
      (click)="togglePanel()"
      [attr.aria-expanded]="panelOpen()"
      aria-label="Notifications"
    >
      <span aria-hidden="true">◔</span>
      @if (unreadCount() > 0) {
        <span class="count">{{ unreadCount() }}</span>
      }
    </button>

    <button
      class="user"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-haspopup="menu"
    >
      <span class="avatar" aria-hidden="true">{{ user().initials }}</span>
      <span class="user-text">
        <strong>{{ user().name }}</strong>
        <small>{{ user().role }}</small>
      </span>
      <span class="caret" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path
            d="m4 6 4 4 4-4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="menu" role="menu">
      <div class="menu-head">
        <span class="avatar lg" aria-hidden="true">{{ user().initials }}</span>
        <div class="menu-id">
          <strong>{{ user().name }}</strong>
          <small>{{ user().email }}</small>
        </div>
      </div>

      <button class="menu-item" type="button" role="menuitem" (click)="toggleTheme()">
        <span class="mi-icon" aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
        {{ theme() === 'dark' ? 'Light theme' : 'Dark theme' }}
      </button>

      <div class="menu-sep"></div>

      <button class="menu-item danger" type="button" role="menuitem" (click)="signOut()">
        <span class="mi-icon" aria-hidden="true">⤶</span>
        Sign out
      </button>
    </div>
  }

  @if (panelOpen()) {
    <div class="panel">
      <div class="panel-head">
        <strong>Notifications</strong>
        <button class="btn btn-ghost btn-sm" type="button" (click)="togglePanel()">Close</button>
      </div>
      @for (n of notifications(); track n.id) {
        <div class="note">
          <span class="note-dot" [class]="'kind-' + n.kind" aria-hidden="true"></span>
          <div>
            <strong>{{ n.title }}</strong>
            <p class="muted">{{ n.body }}</p>
          </div>
        </div>
      } @empty {
        <p class="muted empty">Nothing yet.</p>
      }
    </div>
  }
</header>
