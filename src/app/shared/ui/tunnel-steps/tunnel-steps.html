<nav class="tunnel-steps" aria-label="Progress">
  <button type="button" class="back-link" (click)="back()">
    <svg class="back-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path
        d="M12.5 4.5 6 10l6.5 5.5M6 10h9"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    Back
  </button>

  @for (step of steps; track step.key) {
    <button
      type="button"
      class="step"
      [class.current]="step.key === current()"
      [class.reachable]="isReachable(step) && step.key !== current()"
      [class.upcoming]="!isReachable(step) && step.key !== current()"
      [disabled]="!isReachable(step) || step.key === current()"
      (click)="go(step)"
    >
      <span class="dot" aria-hidden="true"></span>
      <span class="step-label">
        {{ step.label }}
        @if (step.optional) {
          <span class="step-optional">(optional)</span>
        }
      </span>
    </button>
  }
</nav>
