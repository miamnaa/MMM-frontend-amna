<nav class="tunnel-steps" aria-label="Progress">
  <button type="button" class="back-link" (click)="back()">
    <svg class="back-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
      <polyline points="11 6 5 12 11 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </svg>
    Back
  </button>

  @for (step of steps; track step.key) {
    <button
      type="button"
      class="step"
      [class.current]="step.key === current()"
      [class.reachable]="isReachable(step) && step.key !== current()"
      [class.upcoming]="!isReachable(step) && step.key !== current()"
      [disabled]="!isReachable(step) || step.key === current()"
      (click)="go(step)"
    >
      <span class="dot" aria-hidden="true"></span>
      <span class="step-label">
        {{ step.label }}
        @if (step.optional) {
          <span class="step-optional">(optional)</span>
        }
      </span>
    </button>
  }
</nav>
