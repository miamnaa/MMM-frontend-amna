<app-auth-shell>
  <h1>Sign in</h1>
  <p class="lede">Welcome back. Pick up where your last run left off.</p>

  <button
    class="btn sso"
    type="button"
    [disabled]="submitting()"
    (click)="signInWithMicrosoft()"
  >
    <span class="ms-logo" aria-hidden="true">
      <i class="q q1"></i><i class="q q2"></i><i class="q q3"></i><i class="q q4"></i>
    </span>
    {{ submitting() ? 'Signing in…' : 'Continue with Microsoft' }}
  </button>

  <p class="sso-note">
    ROIVIO uses your organisation's Microsoft account. Single sign-on and multi-factor
    authentication are handled by Microsoft Entra ID — there is no separate password to manage.
  </p>

  <p class="switch">
    New to ROIVIO? <a class="link" routerLink="/signup">Create an account</a>
  </p>
</app-auth-shell>
