<div class="login">
  <!-- Decorative corner arcs -->
  <span class="arc arc-tr" aria-hidden="true"></span>
  <span class="arc arc-bl" aria-hidden="true"></span>

  <header class="corner-logo">
    <app-logo [size]="26" [flat]="true" />
    <span class="corner-name">ROIVIO</span>
  </header>

  <main class="stack">
    <h1 class="emblem">
      <app-logo class="logo-lg" [size]="104" />
      <span class="sr-only">ROIVIO</span>
    </h1>

    <p class="tagline">The ROI engine for modern marketers</p>

    <button
      class="signin"
      type="button"
      [disabled]="submitting()"
      (click)="signInWithMicrosoft()"
    >
      <span class="ms-logo" aria-hidden="true">
        <i class="q q1"></i><i class="q q2"></i><i class="q q3"></i><i class="q q4"></i>
      </span>
      {{ submitting() ? 'Signing in…' : 'Sign in with Microsoft' }}
    </button>

    <p class="note">
      Single sign-on and multi-factor authentication are handled by Microsoft Entra ID.
    </p>

    <p class="switch">
      Don't have an account? <a routerLink="/signup">Create account</a>
    </p>
  </main>
</div>
