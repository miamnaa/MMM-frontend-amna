<div class="login">
  <!-- Decorative corner arcs -->
  <span class="arc arc-tr" aria-hidden="true"></span>
  <span class="arc arc-bl" aria-hidden="true"></span>

  <header class="corner-logo">
    <span class="cbt" aria-hidden="true">cbt</span>
    <span class="mixiq">MIXIQ</span>
    <span class="sr-only">CBT MIXIQ</span>
  </header>

  <main class="stack">
    <h1 class="wordmark">ROIVIO</h1>
    <p class="tagline">The ROI engine for modern marketers</p>

    <button
      class="signin"
      type="button"
      [disabled]="submitting()"
      (click)="continueWithMicrosoft()"
    >
      <span class="ms-logo" aria-hidden="true">
        <i class="q q1"></i><i class="q q2"></i><i class="q q3"></i><i class="q q4"></i>
      </span>
      {{ submitting() ? 'Creating account…' : 'Sign up with Microsoft' }}
    </button>

    <p class="note">
      Subscribed through Microsoft Marketplace? Your tenant is provisioned automatically the
      first time you sign in.
    </p>

    <p class="switch">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </main>
</div>
