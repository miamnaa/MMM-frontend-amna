<div class="upload-page">
  <app-page-header
    title="Upload data"
    subtitle="Pick your modeling engine and add the spend file this project will use."
  />

  <section class="card">
    <h2 class="section-title">Model</h2>
    <div class="model-grid">
      @for (option of modelOptions; track option.value) {
        <button
          type="button"
          class="model-card"
          [class.selected]="modelType() === option.value"
          (click)="selectModel(option.value)"
        >
          <span class="model-label">{{ option.label }}</span>
          <span class="model-desc">{{ option.description }}</span>
        </button>
      }
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">Dataset file</h2>

    <div
      class="dropzone"
      [class.active]="dragging()"
      [class.busy]="uploading()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop($event)"
    >
      <div class="drop-inner">
        <span class="drop-icon" aria-hidden="true">↥</span>
        <div class="drop-text">
          @if (file(); as f) {
            <strong>{{ f.name }}</strong>
            <span class="muted">Ready to upload — pick a different file to replace it.</span>
          } @else {
            <strong>Drop a file here, or browse</strong>
            <span class="muted">CSV, XLSX or Parquet</span>
          }
        </div>

        <label class="btn btn-secondary">
          Browse files
          <input type="file" [accept]="accepted" (change)="onPick($event)" hidden />
        </label>
      </div>

      @if (error(); as err) {
        <p class="drop-error">{{ err }}</p>
      }
    </div>
  </section>

  <div class="tunnel-actions">
    <button
      class="btn btn-primary btn-lg"
      type="button"
      [disabled]="!file() || uploading()"
      (click)="continue()"
    >
      {{ uploading() ? 'Uploading…' : 'Continue' }}
    </button>
  </div>
</div>
