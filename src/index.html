<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RoivioUi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SVG only, on purpose - the old favicon.ico was Angular's stock default icon, and keeping it
       linked (even as a fallback) left a path back to it. Every modern browser (Edge included)
       fully supports an SVG-only favicon, so there's no need for an .ico at all anymore. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <!-- CBT brand kit typefaces (brand-kit/tokens/fonts.css) - Playfair Display for headings, DM Sans for body, JetBrains Mono for code/mono text. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
